app = "hovod-learn"
primary_region = "iad"

[build]
  dockerfile = "apps/learn/Dockerfile"

[env]
  NODE_ENV = "production"
  HOVOD_API_BASE_URL = "http://hovod.internal:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
