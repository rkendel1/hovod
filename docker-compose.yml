services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: hovod
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --loglevel warning
    ports:
      - "6379:6379"

  proposal-redis:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --loglevel warning
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/hovod-vod;
      mc anonymous set download local/hovod-vod/playback;
      mc anonymous set download local/hovod-vod/settings;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    ports:
      - "3002:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3002}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3003:3001"

  # OpenReels stack
  openreels-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - openreels-redis-data:/data

  openreels-api:
    image: ghcr.io/tsensei/openreels:latest
    restart: unless-stopped
    env_file: .env.openreels
    environment:
      REDIS_URL: redis://openreels-redis:6379
      PORT: 3000
    volumes:
      - openreels-output:/output
      - openreels-jobs:/app/jobs
    depends_on:
      - openreels-redis
    # ports:
    #   - "3100:3000"

  openreels-worker:
    image: ghcr.io/tsensei/openreels:latest
    restart: unless-stopped
    env_file: .env.openreels
    environment:
      REDIS_URL: redis://openreels-redis:6379
      SHM_SIZE: 2gb
    shm_size: "2gb"
    volumes:
      - openreels-output:/output
      - openreels-jobs:/app/jobs
    depends_on:
      - openreels-redis
      - openreels-api
    command: ["npx", "tsx", "src/worker.ts"]

  openreels-hovod-publisher:
    build:
      context: ./services/openreels-publisher
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.openreels
      - .env
    environment:
      HOVOD_BASE_URL: http://api:3000
      HOVOD_API_KEY: ${HOVOD_API_KEY:-}
      OPENREELS_OUTPUT_DIR: /output
      OPENREELS_API_URL: http://openreels-api:3000
      MAPPINGS_FILE: /data/openreels-job-map.json
      POLL_INTERVAL_MS: 15000
      AUTO_PROCESS: true
      PORT: 3201
    volumes:
      - openreels-output:/output:ro
      - openreels-publisher-data:/data
    depends_on:
      - openreels-api
      - api

  source-discovery:
    build:
      context: ./services/source-discovery
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.proposals
    environment:
      REDIS_URL: redis://proposal-redis:6379
      DATABASE_URL: ${DATABASE_URL}
      DISCOVERY_INTERVAL_HOURS: ${DISCOVERY_INTERVAL_HOURS:-6}
      MAX_CANDIDATES_PER_RUN: ${MAX_CANDIDATES_PER_RUN:-50}
    depends_on:
      - proposal-redis
      - api

  source-analyzer:
    build:
      context: ./services/source-analyzer
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.proposals
    environment:
      REDIS_URL: redis://proposal-redis:6379
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - proposal-redis
      - api

  proposal-generator:
    build:
      context: ./services/proposal-generator
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.proposals
    environment:
      REDIS_URL: redis://proposal-redis:6379
      DATABASE_URL: ${DATABASE_URL}
      MIN_QUALITY_SCORE: ${MIN_QUALITY_SCORE:-0.65}
      AUTO_APPROVE_ABOVE: ${AUTO_APPROVE_ABOVE:-0}
    depends_on:
      - proposal-redis
      - api

  learn:
    build:
      context: .
      dockerfile: apps/learn/Dockerfile
    environment:
      HOVOD_API_BASE_URL: http://api:3000
      HOVOD_API_KEY: ${HOVOD_API_KEY}
      OPENREELS_API_URL: http://openreels-api:3000
      OPENREELS_PUBLISHER_URL: http://openreels-hovod-publisher:3201
      NEXT_PUBLIC_HOVOD_DASHBOARD_URL: ${NEXT_PUBLIC_HOVOD_DASHBOARD_URL:-http://localhost:3003}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3004:3000"

volumes:
  mysql-data:
  minio-data:
  uploads:
  openreels-redis-data:
  openreels-output:
  openreels-jobs:
  openreels-publisher-data:
